[project]
name = "letscode-cli"
version = "0.1.0"
description = "A from-scratch coding agent — bring your own OpenRouter API key"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Srini" }]
keywords = ["coding-agent", "llm", "openrouter", "cli", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
letscode = "letscode.agent:main"

[project.urls]
Homepage = "https://github.com/srinivasankh/letscode"
Repository = "https://github.com/srinivasankh/letscode"
Issues = "https://github.com/srinivasankh/letscode/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/letscode"]

[tool.uv]
reinstall = true

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
